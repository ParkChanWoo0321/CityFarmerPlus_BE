plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'chungbuk'
version = '0.0.1-SNAPSHOT'
description = 'CityFarmerPlus'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.31.78')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.google.cloud:google-cloud-storage:2.71.0'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'com.nimbusds:nimbus-jose-jwt'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'mysql-integration'
    }
}

tasks.register('mysqlIntegrationTest', Test) {
    description = 'Runs opt-in persistence contracts against a dedicated MySQL database.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'mysql-integration'
    }

    shouldRunAfter tasks.named('test')

    doFirst {
        def requiredVariables = ['DB_URL', 'DB_USERNAME', 'DB_PASSWORD']
        def missingVariables = requiredVariables.findAll { variableName ->
            !System.getenv(variableName)?.trim()
        }

        if (!missingVariables.isEmpty()) {
            throw new GradleException(
                    "mysqlIntegrationTest requires non-blank DB_URL, DB_USERNAME, and DB_PASSWORD " +
                            "environment variables. Missing: ${missingVariables.join(', ')}. " +
                            'Use a cloned or dedicated MySQL test database; never run this task against production.'
            )
        }
    }
}
