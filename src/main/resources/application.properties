spring.application.name=CityFarmerPlus
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cityfarmerplus?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:https://api.cityfarmerplus.local}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1h}
app.admin-provisioning.enabled=${ADMIN_PROVISIONING_ENABLED:false}
app.admin-provisioning.key=${ADMIN_PROVISIONING_KEY:}
app.file-storage.root=${FILE_STORAGE_ROOT:./data/uploads}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=35MB
