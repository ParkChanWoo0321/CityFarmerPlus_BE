spring.application.name=CityFarmerPlus
server.address=0.0.0.0
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cityfarmerplus?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.initialization-fail-timeout=${DB_POOL_INITIALIZATION_FAIL_TIMEOUT:60000}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:https://api.cityfarmerplus.local}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1h}
app.file-storage.type=${FILE_STORAGE_TYPE:local}
app.admin.provisioning-key=${ADMIN_PROVISIONING_KEY:}
app.file-storage.root=${FILE_STORAGE_ROOT:./data/uploads}
app.file-storage.s3.endpoint=${S3_ENDPOINT:}
app.file-storage.s3.region=${S3_REGION:}
app.file-storage.s3.bucket=${S3_BUCKET:}
app.file-storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
app.file-storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
app.file-storage.s3.path-style=${S3_PATH_STYLE:true}
app.file-storage.s3.prefix=${S3_PREFIX:}
app.file-storage.gcs.project-id=${GCS_PROJECT_ID:}
app.file-storage.gcs.bucket=${GCS_BUCKET:}
app.file-storage.gcs.prefix=${GCS_PREFIX:}
app.file-cleanup.fixed-delay=${FILE_CLEANUP_FIXED_DELAY:60000}
app.file-cleanup.initial-delay=${FILE_CLEANUP_INITIAL_DELAY:60000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=31MB
