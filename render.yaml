services:
  - type: web
    name: cityfarmerplus-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JPA_DDL_AUTO
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
      - key: FILE_STORAGE_TYPE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PATH_STYLE
        value: "true"
      - key: S3_PREFIX
        value: cityfarmerplus
