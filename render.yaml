services:
  - type: web
    name: cityfarmerplus-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JPA_DDL_AUTO
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
      - key: FILE_STORAGE_TYPE
        value: local
      - key: FILE_STORAGE_ROOT
        value: ./data/uploads
