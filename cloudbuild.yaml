steps:
  - id: test
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    env:
      - GRADLE_USER_HOME=/workspace/.gradle
    args:
      - -ceu
      - |
        if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "main" ]; then
          echo "Only main branch builds are allowed." >&2
          exit 1
        fi
        chmod +x gradlew
        ./gradlew test --no-daemon --max-workers=1

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}

  - id: deploy-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Bootstrap build complete; Cloud Run update skipped."
          exit 0
        fi
        gcloud run services update "${_SERVICE}" \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}" \
          --quiet

substitutions:
  _REGION: us-west1
  _REPOSITORY: cityfarmerplus
  _IMAGE: cityfarmerplus-api
  _SERVICE: cityfarmerplus-api
  _TAG: bootstrap
  _DEPLOY: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_STANDARD_2

timeout: 1800s
